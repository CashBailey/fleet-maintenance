name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: fleetline_ci
          POSTGRES_USER: fleetline
          POSTGRES_PASSWORD: fleetline-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetline -d fleetline_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CI: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-valid-for-any-deployment-0123456789
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fleetline_ci
      POSTGRES_USER: fleetline
      POSTGRES_PASSWORD: fleetline-ci-only
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-dev.lock
          npm ci

      - name: Install Chrome browsers for Playwright
        run: npx playwright install --with-deps chromium chrome

      - name: Audit production dependencies
        run: |
          .venv/bin/pip-audit --requirement requirements.lock
          npm audit --omit=dev --audit-level=high

      - name: Generate dependency inventories
        run: bash scripts/sbom.sh

      - name: Run complete verification
        run: |
          test -f scripts/verify.sh
          bash scripts/verify.sh

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/
            playwright-report/
            test-results/
            logs/
