[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["backend/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "DJ"]
ignore = ["S101", "DJ008"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["backend"]
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations", "tests\\.py$"]

[tool.django-stubs]
django_settings_module = "fleetops.settings"

[tool.coverage.run]
source = ["backend"]
omit = ["*/migrations/*", "*/asgi.py", "*/wsgi.py", "*/manage.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
